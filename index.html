<script>
(function(){
'use strict';

var brl=function(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})};
var $=function(s){return document.querySelector(s)};
var gid=function(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8))};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var ESP='sem glúten e sem lactose';

var SEED=[
  {id:'mineira',nome:'Mineira',preco:18,precoEsp:20,cores:['#f3dcae','#c9553b','#f3dcae'],ordem:1},
  {id:'olho-de-sogra',nome:'Olho de Sogra',preco:18,precoEsp:20,cores:['#3b2218','#f7efe2','#8c1d36'],ordem:2},
  {id:'brigadeiro',nome:'Brigadeiro',preco:18,precoEsp:20,cores:['#6b4030','#3a2219','#6b4030'],ordem:3},
  {id:'2-amores',nome:'2 Amores',preco:18,precoEsp:20,cores:['#3a2219','#f7efe2','#3a2219'],ordem:4}
];

var S={
  tab:'cardapio', tipoView:'pedido', ready:false, mode:'',
  sabores:[], pedidos:[], cfg:{loja:'Bolos de Pote',pixChave:'',pixNome:'',pixCidade:'',pixQr:''},
  cart:{}, editing:null, draft:null, sdraft:null, sheet:null, pixOrder:'', confirm:''
};
var DB=null, pickTarget='', toastT=null, confirmT=null, jarN=0;

function jar(cores){
  var id='j'+(++jarN);
  var c=(cores&&cores.length)?cores:['#4a2a1d','#f1e4cf','#b8213f'];
  var n=c.length, top=46, bot=138, h=(bot-top)/n, bands='';
  for(var i=n-1;i>=0;i--){
    var y=bot-(i+1)*h;
    bands+='<path d="M8 '+y.toFixed(1)+' q12.5 -7 25 0 t25 0 t25 0 t25 0 V'+bot+' H8Z" fill="'+esc(c[i])+'"/>';
  }
  return '<svg viewBox="0 0 120 150" aria-hidden="true">'
   +'<defs><clipPath id="'+id+'"><path d="M8 40H112V128Q112 142 98 142H22Q8 142 8 128Z"/></clipPath></defs>'
   +'<g clip-path="url(#'+id+')"><rect x="8" y="40" width="104" height="104" fill="rgba(255,255,255,.55)"/>'+bands+'</g>'
   +'<path d="M8 40H112V128Q112 142 98 142H22Q8 142 8 128Z" fill="none" stroke="rgba(120,90,100,.55)" stroke-width="2.5"/>'
   +'<rect x="17" y="52" width="6" height="74" rx="3" fill="#fff" opacity=".4"/>'
   +'<rect x="4" y="20" width="112" height="22" rx="6" fill="#3a2219"/>'
   +'<rect x="10" y="24" width="100" height="4" rx="2" fill="#fff" opacity=".18"/></svg>';
}
function pic(f){
  return f.img?'<img src="'+esc(f.img)+'" alt="Bolo de pote '+esc(f.nome)+'" loading="lazy">':jar(f.cores);
}

var LS='bolos-de-pote-v1';
function lsLoad(){
  try{
    var r=JSON.parse(localStorage.getItem(LS)||'null');
    if(r){S.sabores=r.sabores||[];S.pedidos=r.pedidos||[];S.cfg=Object.assign({},S.cfg,r.cfg||{});}
  }catch(e){}
}
function lsSave(){
  try{localStorage.setItem(LS,JSON.stringify({sabores:S.sabores,pedidos:S.pedidos,cfg:S.cfg}))}
  catch(e){toast('A memória do navegador encheu. Use fotos menores.')}
}
function sortSabores(){S.sabores.sort(function(a,b){return (a.ordem||0)-(b.ordem||0)})}
async function put(coll,id,obj){
  if(DB){
    try{await DB.doc(coll+'/'+id).set(obj,{merge:true});return true}
    catch(e){console.error(e);toast('Não foi possível salvar. Tente de novo.');return false}
  }
  var arr=S[coll], row=Object.assign({id:id},obj), i=arr.findIndex(function(x){return x.id===id});
  if(i<0)arr.push(row);else arr[i]=row;
  if(coll==='sabores')sortSabores();
  lsSave();render(true);return true;
}
async function del(coll,id){
  if(DB){
    try{await DB.doc(coll+'/'+id).delete();return true}
    catch(e){console.error(e);toast('Não foi possível excluir. Tente de novo.');return false}
  }
  S[coll]=S[coll].filter(function(x){return x.id!==id});lsSave();render(true);return true;
}
async function putCfg(patch){
  var next=Object.assign({},S.cfg,patch);
  if(DB){
    try{await DB.doc('config/geral').set(next,{merge:true});return true}
    catch(e){console.error(e);toast('Não foi possível salvar. Tente de novo.');return false}
  }
  S.cfg=next;lsSave();render(true);return true;
}
function subscribe(){
  var fail=function(err){console.error('[firestore]',err);S.ready=true;render()};
  DB.collection('sabores').onSnapshot(function(s){
    S.sabores=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    sortSabores();S.ready=true;render();
  },fail);
  DB.collection('pedidos').onSnapshot(function(s){
    S.pedidos=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    render();
  },fail);
  DB.doc('config/geral').onSnapshot(function(d){
    S.cfg=Object.assign({loja:'Bolos de Pote',pixChave:'',pixNome:'',pixCidade:'',pixQr:''},d.exists?d.data():{});
    render();
  },fail);
}

function lineKey(sid,esp){return sid+'|'+(esp?'s':'n')}
function lineInfo(k){
  var p=k.lastIndexOf('|'), sid=k.slice(0,p), esp=k.slice(p+1)==='s';
  var f=S.sabores.find(function(x){return x.id===sid});
  var snap=S.draft&&S.draft.snap&&S.draft.snap[k];
  if(snap)return {nome:snap.nome,preco:snap.preco,esp:esp};
  if(f)return {nome:f.nome,preco:esp?(f.precoEsp||0):(f.preco||0),esp:esp};
  return {nome:'Sabor removido',preco:0,esp:esp};
}
function cartCount(){var n=0;for(var k in S.cart)n+=S.cart[k]||0;return n}
function cartTotal(){var t=0;for(var k in S.cart){if(S.cart[k]>0)t+=S.cart[k]*lineInfo(k).preco}return t}
function itemLabel(it){return it.qtd+'× '+it.nome+(it.esp?' ('+ESP+')':'')}
function digits(s){return String(s||'').replace(/\D/g,'')}
function fmtPhone(v){
  var d=digits(v).slice(0,11);
  if(!d)return '';
  if(d.length>10)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
  if(d.length>6)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
  if(d.length>2)return '('+d.slice(0,2)+') '+d.slice(2);
  return '('+d;
}
function waLink(num,msg){
  var d=digits(num);
  if(d.length<=11)d='55'+d;
  return 'https://wa.me/'+d+(msg?'?text='+encodeURIComponent(msg):'');
}
function orderMsg(p){
  var l=['Oi, '+p.nome+'! Seu pedido de bolo de pote:'];
  (p.itens||[]).forEach(function(it){l.push(itemLabel(it))});
  l.push('Total: '+brl(p.total));
  if(p.tipo==='encomenda'&&p.data)l.push('Para: '+dayLabel(p.data));
  if(p.modo==='retirada')l.push('Retirada');
  else if(p.end)l.push('Entrega em: '+p.end);
  if(p.obs)l.push('Obs.: '+p.obs);
  if(S.cfg.pixChave)l.push('PIX: '+S.cfg.pixChave);
  return l.join('\n');
}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDay(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function dayLabel(s){
  if(!s)return '';
  var t=todayStr();
  var d=parseDay(s), base=parseDay(t), diff=Math.round((d-base)/86400000);
  var txt=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
  if(diff===0)return 'hoje · '+txt;
  if(diff===1)return 'amanhã · '+txt;
  if(diff<0)return 'atrasada · '+txt;
  return txt;
}

function toImage(file,max,type,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var im=new Image();
      im.onerror=rej;
      im.onload=function(){
        var s=Math.min(1,max/Math.max(im.width,im.height));
        var cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(im.width*s));cv.height=Math.max(1,Math.round(im.height*s));
        var ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
        ctx.drawImage(im,0,0,cv.width,cv.height);
        var data;
        if(type==='image/jpeg'){
          var qq=q, LIMIT=170000;
          for(var i=0;i<7;i++){
            data=cv.toDataURL(type,qq);
            if(data.length<LIMIT||qq<=0.35)break;
            qq-=0.1;
          }
        }else{
          data=cv.toDataURL(type,q);
        }
        res(data);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function pixTlv(id,val){return id+String(String(val).length).padStart(2,'0')+String(val)}
function pixCrc16(str){
  var crc=0xFFFF;
  for(var i=0;i<str.length;i++){
    crc^=(str.charCodeAt(i)&0xFF)<<8;
    for(var j=0;j<8;j++){
      crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);
      crc&=0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function pixSanitize(s,max){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9 ]/g,'').replace(/\s+/g,' ').trim().slice(0,max).toUpperCase();
}
function pixPayload(chave,nome,cidade,valor,txid){
  if(!chave)return '';
  var k=pixSanitize(chave,77)||String(chave).slice(0,77);
  var n=pixSanitize(nome,25)||'RECEBEDOR';
  var c=pixSanitize(cidade,15)||'BRASIL';
  var amt=valor?(Math.round(valor*100)/100).toFixed(2):'';
  var tx=pixSanitize(txid,25)||'***';
  var mai=pixTlv('00','br.gov.bcb.pix')+pixTlv('01',k);
  var body=''
    +pixTlv('00','01')
    +pixTlv('26',mai)
    +pixTlv('52','0000')
    +pixTlv('53','986')
    +(amt?pixTlv('54',amt):'')
    +pixTlv('58','BR')
    +pixTlv('59',n)
    +pixTlv('60',c)
    +pixTlv('62',pixTlv('05',tx))
    +'6304';
  return body+pixCrc16(body);
}
function pixCopyBlock(valor,txid,compact){
  if(!S.cfg.pixChave)return '';
  var p=pixPayload(S.cfg.pixChave,S.cfg.pixNome,S.cfg.pixCidade,valor,txid);
  var rows=p.match(/.{1,72}/g).join('\n');
  return '<div class="copypaste"><label>PIX Copia e Cola'
    +(valor?' <span class="muted">('+brl(valor)+')</span>':'')
    +'<textarea id="pix-payload" readonly rows="'+(compact?4:5)+'">'+esc(rows)+'</textarea></label>'
    +'<div class="row"><button class="btn sm" data-act="copy-payload">Copiar código</button>'
    +(compact?'':'<button class="btn sm ghost" data-act="copy-key">Copiar só a chave</button>')
    +'</div></div>';
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function loadImg(src){
  return new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){res(im)};
    im.onerror=rej;
    im.src=src;
  });
}
function drawJarCanvas(ctx,x,y,w,h,cores){
  var jarW=Math.min(w*0.55,180);
  var jarH=jarW*1.25;
  var jx=x+(w-jarW)/2;
  var jy=y+(h-jarH)/2+8;
  var bodyTop=jy+30;
  var bodyH=jarH-30;
  var cs=(cores&&cores.length)?cores:['#4a2a1d','#f1e4cf','#b8213f'];
  var bandH=bodyH/cs.length;
  ctx.save();
  roundRect(ctx,jx,bodyTop,jarW,bodyH,14);
  ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillRect(jx,bodyTop,jarW,bodyH);
  for(var i=0;i<cs.length;i++){
    ctx.fillStyle=cs[i];
    ctx.fillRect(jx,bodyTop+i*bandH,jarW,bandH+1.5);
  }
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fillRect(jx+14,bodyTop+14,10,bodyH-28);
  ctx.restore();
  ctx.strokeStyle='rgba(120,90,100,.5)';
  ctx.lineWidth=3;
  roundRect(ctx,jx,bodyTop,jarW,bodyH,14);
  ctx.stroke();
  ctx.fillStyle='#3a2219';
  roundRect(ctx,jx-8,jy,jarW+16,40,8);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';
  ctx.fillRect(jx-4,jy+7,jarW+8,4);
}
async function drawCardCanvas(ctx,x,y,w,h,imgH,f){
  roundRect(ctx,x,y,w,h,24);
  ctx.fillStyle='#ffffff';
  ctx.fill();
  ctx.strokeStyle='#ead8de';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.save();
  roundRect(ctx,x,y,w,imgH,24);
  ctx.clip();
  ctx.fillStyle='#f6ebef';
  ctx.fillRect(x,y,w,imgH);
  var drawn=false;
  if(f.img){
    try{
      var im=await loadImg(f.img);
      var ar=im.width/im.height, targetAr=w/imgH;
      var dw,dh,dx,dy;
      if(ar>targetAr){dh=imgH;dw=imgH*ar;dx=x-(dw-w)/2;dy=y;}
      else{dw=w;dh=w/ar;dx=x;dy=y-(dh-imgH)/2;}
      ctx.drawImage(im,dx,dy,dw,dh);
      drawn=true;
    }catch(e){}
  }
  if(!drawn)drawJarCanvas(ctx,x,y,w,imgH,f.cores);
  ctx.restore();
  var tx=x+28, ty=y+imgH+26;
  ctx.fillStyle='#2b1820';
  ctx.font='700 34px "Bricolage Grotesque", system-ui, sans-serif';
  var nome=f.nome||'';
  var maxW=w-56;
  if(ctx.measureText(nome).width>maxW){
    while(nome.length>1&&ctx.measureText(nome+'…').width>maxW)nome=nome.slice(0,-1);
    nome+='…';
  }
  ctx.fillText(nome,tx,ty);
  ty+=46;
  ctx.fillStyle='#b8213f';
  ctx.font='700 28px Figtree, system-ui, sans-serif';
  ctx.fillText(brl(f.preco),tx,ty);
  if(f.precoEsp>0){
    ty+=34;
    ctx.fillStyle='#6b5360';
    ctx.font='500 20px Figtree, system-ui, sans-serif';
    ctx.fillText('s/ glúten e lactose · '+brl(f.precoEsp),tx,ty);
  }
}
async function shareMenuImage(){
  if(!S.sabores.length){toast('Sem sabores para compartilhar');return}
  toast('Preparando imagem…');
  try{await (document.fonts&&document.fonts.ready)||Promise.resolve()}catch(e){}
  var W=1080, PAD=56, COLS=2, GAP=28;
  var CARD_W=(W-PAD*2-GAP*(COLS-1))/COLS;
  var IMG_H=240, INFO_H=140, CARD_H=IMG_H+INFO_H;
  var HEADER_H=230, FOOTER_H=110;
  var rows=Math.ceil(S.sabores.length/COLS);
  var H=HEADER_H+PAD+rows*CARD_H+(rows-1)*GAP+FOOTER_H;
  var scale=Math.min(2,Math.max(1,3000/H));
  var cv=document.createElement('canvas');
  cv.width=Math.round(W*scale);
  cv.height=Math.round(H*scale);
  var ctx=cv.getContext('2d');
  ctx.scale(scale,scale);
  ctx.textBaseline='top';
  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#fbf5f6');
  grad.addColorStop(1,'#f6ebef');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#b8213f';
  ctx.font='800 66px "Bricolage Grotesque", system-ui, sans-serif';
  var brand=S.cfg.loja||'Bolos de Pote';
  var maxBrandW=W-PAD*2;
  if(ctx.measureText(brand).width>maxBrandW){
    while(brand.length>1&&ctx.measureText(brand+'…').width>maxBrandW)brand=brand.slice(0,-1);
    brand+='…';
  }
  ctx.fillText(brand,PAD,PAD);
  ctx.fillStyle='#6b5360';
  ctx.font='500 30px Figtree, system-ui, sans-serif';
  ctx.fillText('Cardápio · faça seu pedido',PAD,PAD+92);
  var lineY=PAD+150;
  ctx.strokeStyle='#ead8de';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(PAD,lineY);ctx.lineTo(W-PAD,lineY);ctx.stroke();
  var topY=HEADER_H+PAD;
  for(var i=0;i<S.sabores.length;i++){
    var f=S.sabores[i];
    var col=i%COLS, row=Math.floor(i/COLS);
    var x=PAD+col*(CARD_W+GAP);
    var y=topY+row*(CARD_H+GAP);
    await drawCardCanvas(ctx,x,y,CARD_W,CARD_H,IMG_H,f);
  }
  ctx.fillStyle='#6b5360';
  ctx.font='500 22px Figtree, system-ui, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('Para pedir, chame no WhatsApp',W/2,H-PAD-40);
  ctx.textAlign='start';
  var blob=await new Promise(function(r){cv.toBlob(r,'image/png')});
  if(!blob){toast('Não foi possível gerar a imagem');return}
  var file;
  try{file=new File([blob],'cardapio.png',{type:'image/png'})}catch(e){file=null}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title:S.cfg.loja||'Bolos de Pote',
        text:'Confira nosso cardápio!'
      });
      return;
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='cardapio-'+(S.cfg.loja||'bolos').toLowerCase().replace(/\s+/g,'-')+'-'+todayStr()+'.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
  toast('Imagem baixada');
}

async function importJSON(file){
  var data;
  try{data=JSON.parse(await file.text())}catch(e){toast('Arquivo inválido');return}
  if(!data||typeof data!=='object'){toast('Arquivo inválido');return}
  var nS=(data.sabores||[]).length, nP=(data.pedidos||[]).length;
  var resumo=nS+' sabor(es)\n'+nP+' pedido(s)';
  if(data.exportadoEm){try{resumo+='\n\nExportado em '+new Date(data.exportadoEm).toLocaleString('pt-BR')}catch(e){}}
  if(!confirm('Substituir TODOS os dados atuais por este backup?\n\n'+resumo))return;
  if(DB){
    try{
      var tasks=[];
      S.sabores.forEach(function(s){tasks.push(DB.doc('sabores/'+s.id).delete())});
      S.pedidos.forEach(function(p){tasks.push(DB.doc('pedidos/'+p.id).delete())});
      await Promise.all(tasks);
      var puts=[];
      (data.sabores||[]).forEach(function(s){var o=clone(s);delete o.id;puts.push(DB.doc('sabores/'+s.id).set(o))});
      (data.pedidos||[]).forEach(function(p){var o=clone(p);delete o.id;puts.push(DB.doc('pedidos/'+p.id).set(o))});
      await Promise.all(puts);
      if(data.cfg)await DB.doc('config/geral').set(data.cfg,{merge:true});
    }catch(e){toast('Falha ao importar');return}
  }else{
    S.sabores=data.sabores||[];
    S.pedidos=data.pedidos||[];
    S.cfg=Object.assign({},S.cfg,data.cfg||{});
    sortSabores();lsSave();
  }
  render(true);
  toast('Backup importado');
}

function vPedidos(){
  if(!S.ready)return '<p class="muted">Carregando pedidos…</p>';
  var nP=S.pedidos.filter(function(p){return (p.tipo||'pedido')==='pedido'}).length;
  var nE=S.pedidos.filter(function(p){return p.tipo==='encomenda'}).length;
  var list=S.pedidos.filter(function(p){return (p.tipo||'pedido')===S.tipoView}).sort(function(a,b){
    var ea=a.entregue?1:0, eb=b.entregue?1:0;
    if(ea!==eb)return ea-eb;
    if(S.tipoView==='encomenda')return (a.data||'9999').localeCompare(b.data||'9999');
    return (b.criado||0)-(a.criado||0);
  });
  var receber=0,recebido=0;
  list.forEach(function(p){if(p.pago)recebido+=p.total||0;else receber+=p.total||0});
  var h='<div class="sec-head"><h2>Pedidos</h2><button class="btn primary sm" data-act="new-order">+ Novo pedido</button></div>'
   +'<div class="seg" role="group" aria-label="Tipo">'

   +'<div class="strip"><span>A receber <b>'+brl(receber)+'</b></span><span>Recebido <b>'+brl(recebido)+'</b></span></div>';
  if(!list.length){
    return h+'<div class="card empty"><h3>'+(S.tipoView==='encomenda'?'Nenhuma encomenda ainda':'Nenhum pedido ainda')+'</h3>'

async function saveOrder(){
  var d=S.draft, itens=[], total=0, err=$('#o-err');
  Object.keys(S.cart).forEach(function(k){
    var q=S.cart[k];if(q<=0)return;
    var i=lineInfo(k);itens.push({k:k,nome:i.nome,esp:i.esp,qtd:q,preco:i.preco});total+=q*i.preco;
  });
  var msg='';
  if(!d.nome.trim())msg='Informe o nome do cliente.';
  else if(!itens.length)msg='Escolha pelo menos um bolo de pote.';
  else if(d.tipo==='encomenda'&&!d.data)msg='Escolha a data da encomenda.';
  else if(d.modo==='entrega'&&!d.end.trim())msg='Informe o endereço de entrega ou mude para Retirada.';
  if(msg){err.textContent=msg;err.hidden=false;return}
  var id=S.editing||gid();
  var prev=S.pedidos.find(function(p){return p.id===id});
  var ok=await put('pedidos',id,{
    tipo:d.tipo,nome:d.nome.trim(),wa:d.wa.trim(),end:d.modo==='entrega'?d.end.trim():'',modo:d.modo,
    data:d.tipo==='encomenda'?d.data:'',obs:d.obs.trim(),itens:itens,total:total,
    pago:prev?!!prev.pago:false,entregue:prev?!!prev.entregue:false,criado:prev?prev.criado:Date.now()
  });
  if(!ok)return;
  var tipo=d.tipo;
  S.cart={};closeSheet();S.tab='pedidos';S.tipoView=tipo;render(true);
  toast('Pedido salvo');
}

async function saveSabor(){
  var f=S.sdraft, err=$('#s-err');

  if(!f.nome.trim()){err.textContent='Informe o nome do sabor.';err.hidden=false;return}
  if(!(preco>=0)){err.textContent='Informe o preço do bolo de pote.';err.hidden=false;return}
  var id=S.editing||gid();
  var prev=S.sabores.find(function(x){return x.id===id});
  var ordem=prev?(prev.ordem||0):(S.sabores.reduce(function(m,x){return Math.max(m,x.ordem||0)},0)+1);
  var obj={nome:f.nome.trim(),desc:(f.desc||'').trim(),preco:preco,precoEsp:esp>0?esp:0,cores:f.cores,img:f.img||'',ordem:ordem};
  if(await put('sabores',id,obj)){closeSheet();toast('Sabor salvo')}
}

document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(a==='backdrop'){if(e.target===el)closeSheet();return}
  switch(a){
    case 'tab':S.tab=el.getAttribute('data-t');S.confirm='';render(true);window.scrollTo(0,0);break;
    case 'inc':bump(el.getAttribute('data-k'),1);break;
    case 'dec':bump(el.getAttribute('data-k'),-1);break;
    case 'open-cart':openOrder(null);break;
    case 'new-order':S.cart={};openOrder(null);break;
    case 'edit-order':openOrder(id);break;
    case 'close':closeSheet();break;
    case 'set-view':S.tipoView=el.getAttribute('data-v');render(true);break;
    case 'set-tipo':S.draft.tipo=el.getAttribute('data-v');$('#layer .sheet').innerHTML=orderSheetHTML();break;
    case 'set-modo':S.draft.modo=el.getAttribute('data-v');$('#layer .sheet').innerHTML=orderSheetHTML();break;
    case 'save-order':saveOrder();break;
    case 'toggle-pago':{var p=S.pedidos.find(function(x){return x.id===id});if(p){var o=clone(p);delete o.id;o.pago=!p.pago;put('pedidos',id,o)}break}
    case 'toggle-entregue':{var p2=S.pedidos.find(function(x){return x.id===id});if(p2){var o2=clone(p2);delete o2.id;o2.entregue=!p2.entregue;put('pedidos',id,o2)}break}
    case 'mark-paid':{
      var p3=S.pedidos.find(function(x){return x.id===id});
      if(p3){var o3=clone(p3);delete o3.id;o3.pago=true;if(await put('pedidos',id,o3)){toast('Pagamento registrado');if(S.sheet)closeSheet();S.pixOrder='';render(true)}}
      break}
    case 'del-order':{
      var key='del:'+id;
      if(S.confirm===key){S.confirm='';await del('pedidos',id);toast('Pedido excluído')}
      else{S.confirm=key;render(true);clearTimeout(confirmT);confirmT=setTimeout(function(){S.confirm='';render()},4000)}
      break}
    case 'show-pix':{var pp=S.pedidos.find(function(x){return x.id===id});if(pp)openSheet('pix',pixSheetHTML(pp),'Cobrar '+pp.nome);break}
    case 'copy-key':copyText(S.cfg.pixChave);break;
    case 'copy-payload':{var ta=$('#pix-payload');var raw=ta?ta.value.replace(/\s+/g,''):'';copyText(raw);break}
    case 'pick-qr':pickTarget='qr';$('#file-pick').click();break;
    case 'rm-qr':putCfg({pixQr:''});break;
    case 'new-sabor':openSabor(null);break;
    case 'edit-sabor':openSabor(id);break;
    case 'pick-foto':pickTarget='foto';$('#file-pick').click();break;
    case 'rm-foto':S.sdraft.img='';$('#layer .sheet').innerHTML=saborSheetHTML();break;
    case 'save-sabor':saveSabor();break;
    case 'del-sabor':
      if(S.confirm==='del-sabor'){var sid=S.editing;S.confirm='';if(await del('sabores',sid)){closeSheet();toast('Sabor excluído')}}
      else{S.confirm='del-sabor';el.textContent='Confirmar exclusão';el.classList.add('on')}
      break;
    case 'seed':
      for(var i=0;i<SEED.length;i++){var s=clone(SEED[i]);var sid2=s.id;delete s.id;if(!(await put('sabores',sid2,s)))break}
      toast('Sabores de exemplo carregados');
      break;
    case 'share-menu':shareMenuImage();break;
    case 'export-json':exportJSON();break;
    case 'import-json':$('#file-json').click();break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-mask')){
    var pos=t.selectionStart;
    var before=digits(t.value.slice(0,pos)).length;
    var formatted=fmtPhone(t.value);
    if(formatted!==t.value){
      t.value=formatted;
      var count=0,newPos=formatted.length;
      if(before===0){newPos=0}
      else{
        for(var i=0;i<formatted.length;i++){
          if(/\d/.test(formatted[i]))count++;
          if(count===before){newPos=i+1;break}
        }
      }
      try{t.setSelectionRange(newPos,newPos)}catch(err){}
    }
  }
  if(t.dataset.f&&S.draft){S.draft[t.dataset.f]=t.value}
  if(t.dataset.sf&&S.sdraft){S.sdraft[t.dataset.sf]=t.value}
  if(t.dataset.sc!==undefined&&S.sdraft){
    S.sdraft.cores=(S.sdraft.cores||['#3a2219','#f7efe2','#c9553b']).slice();
    S.sdraft.cores[+t.dataset.sc]=t.value;
    if(!S.sdraft.img){var pv=$('#s-prev');if(pv)pv.innerHTML=pic(S.sdraft)}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.cfg){var patch={};patch[t.dataset.cfg]=t.value.trim();putCfg(patch)}
  if(t.id==='pix-order'){S.pixOrder=t.value;render(true)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.sheet){closeSheet();return}
  if(e.key==='Tab'&&S.sheet){
    var sh=$('#layer .sheet');
    if(!sh)return;
    var nodes=sh.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])');
    if(!nodes.length)return;
    var first=nodes[0], last=nodes[nodes.length-1];
    var active=document.activeElement;
    if(e.shiftKey&&(active===first||active===sh)){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&active===last){e.preventDefault();first.focus()}
  }
});
$('#file-pick').addEventListener('change',async function(e){
  var file=e.target.files&&e.target.files[0];e.target.value='';
  if(!file)return;
  try{
    if(pickTarget==='qr'){
      var q=await toImage(file,640,'image/png');
      if(await putCfg({pixQr:q}))toast('QR Code salvo');
    }else if(pickTarget==='foto'&&S.sdraft){
      S.sdraft.img=await toImage(file,720,'image/jpeg',0.8);
      $('#layer .sheet').innerHTML=saborSheetHTML();
    }
  }catch(err){toast('Não foi possível ler essa imagem.')}
});
$('#file-json').addEventListener('change',async function(e){
  var file=e.target.files&&e.target.files[0];e.target.value='';
  if(!file)return;
  await importJSON(file);
});

async function init(){
  render();
  var db=null;
  if(window.__firebaseDB){
    db = window.__firebaseDB;
    console.log('[app] usando Firebase');
  }
  if(db){
    DB = db;
    S.mode = 'db';
    subscribe();
  } else {
    S.mode = 'local';
    lsLoad();
    S.ready = true;
    render(true);
  }
}
init();
})();
</script>

</body></html>
